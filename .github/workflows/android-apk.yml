name: Android APK

on:
  push:
    branches:
      - feat/stage-1-mobile-foundation
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Generate native Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      # React Native no incluye el bundle JS en assembleDebug: necesita Metro.
      # assembleRelease incluye JS/Hermes y permite probar SIN servidor de desarrollo.
      # El prebuild de Expo usa una clave DEBUG para firmar release local;
      # distribución/actualizaciones estables deben hacerse vía EAS preview.
      - name: Build standalone Android APK
        working-directory: android
        env:
          CI: "1"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify standalone APK, package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test "$(stat -c '%s' "$APK")" -gt 1000000
          if ! unzip -Z1 "$APK" | grep -E -q '^assets/index\\.android\\.bundle(\\.hbc)?; then
            echo "::error::La APK no incluye JavaScript/Hermes y necesitaría Metro"
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.solutionsdms.dmsmantenimientos'"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee android-apk.sha256
          echo "APK_SHA256=$(cut -d ' ' -f 1 android-apk.sha256)" >> "$GITHUB_ENV"

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dms-mantenimientos-android-standalone
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android-apk.sha256
          if-no-files-found: error
          retention-days: 14
